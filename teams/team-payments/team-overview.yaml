# Dashboard-as-code: the grafana_dashboard=1 label is what the kube-prometheus-stack
# Grafana sidecar watches for — it loads/updates this dashboard automatically, same
# mechanism the bundled "Kubernetes / ..." dashboards use. Apply directly with
# `kubectl apply -f` (no envsubst — the ${datasource} below is a Grafana template
# variable, not a shell variable).
#
# This is a TEAM-level dashboard, not a per-service one: it rolls up both the
# expense backend and frontend under one team-payments namespace view (all
# queries filter by namespace only, not by pod/deployment name). Per-service
# dashboards are generated by idp-cli (see templates/standard-microservice-template.jsonnet
# in this repo) and live under teams/<team>/<service>.yaml instead. This file
# was migrated here from expenseapp/dashboards/expense-grafana-dashboard.yaml
# on 2026-09-29 as part of centralizing all dashboards into this repo — see
# this repo's README for the full architecture.
#
# Panels 8-11 (mTLS status, response codes, connection failures, circuit breaker open)
# added 2026-10-02 after Istio was deployed to this namespace -- deliberately added
# here rather than a new "platform"/"mesh" dashboard tier, per this repo's README
# ("Two tiers only... deliberately dropped"). Metric names (istio_requests_total,
# envoy_cluster_upstream_cx_connect_fail, envoy_cluster_circuit_breakers_default_cx_open)
# confirmed to actually exist via a live Prometheus query before being used here, not
# guessed from Istio's docs -- envoy_cluster_outlier_detection_ejections_active (the
# metric you'd expect for "is the circuit breaker actively ejecting an endpoint right
# now") does not appear at all until at least one real ejection has happened, so it's
# intentionally not used here; cx_open (circuit breaker tripped) and the raw
# connect-fail counter that feeds it are what's actually observable from a cold start.
# Requires gitops/istio/monitoring.yaml (the PodMonitor/ServiceMonitor that get these
# metrics into Prometheus at all) already applied, or these 4 panels render empty.
apiVersion: v1
kind: ConfigMap
metadata:
  name: team-payments-overview
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    # Folder grouping in Grafana is done via this ConfigMap annotation, not a
    # field inside the dashboard JSON itself — the k8s-sidecar reads it to
    # decide which Grafana folder to file the dashboard under.
    grafana_folder: "Team Payments"
data:
  team-payments-overview.json: |
    {
      "uid": "team-payments-overview",
      "title": "Team Payments — Overview",
      "tags": ["team-payments", "expense"],
      "timezone": "",
      "schemaVersion": 39,
      "refresh": "10s",
      "time": { "from": "now-1h", "to": "now" },
      "templating": {
        "list": [
          {
            "name": "datasource",
            "label": "Data source",
            "type": "datasource",
            "query": "prometheus",
            "current": { "text": "default", "value": "default", "selected": true },
            "hide": 0,
            "regex": ""
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "title": "CPU usage (cores)",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "x": 0, "y": 0, "w": 12, "h": 8 },
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"team-payments\", container!=\"\", container!=\"POD\"}[5m])) by (pod)",
              "legendFormat": "{{pod}}"
            }
          ]
        },
        {
          "id": 2,
          "title": "Memory working set",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "x": 12, "y": 0, "w": 12, "h": 8 },
          "fieldConfig": { "defaults": { "unit": "bytes" }, "overrides": [] },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "sum(container_memory_working_set_bytes{namespace=\"team-payments\", container!=\"\", container!=\"POD\"}) by (pod)",
              "legendFormat": "{{pod}}"
            }
          ]
        },
        {
          "id": 3,
          "title": "Container restarts (last 1h)",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "x": 0, "y": 8, "w": 12, "h": 8 },
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "sum(increase(kube_pod_container_status_restarts_total{namespace=\"team-payments\"}[1h])) by (pod)",
              "legendFormat": "{{pod}}"
            }
          ]
        },
        {
          "id": 4,
          "title": "Network I/O",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "x": 12, "y": 8, "w": 12, "h": 8 },
          "fieldConfig": { "defaults": { "unit": "Bps" }, "overrides": [] },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "sum(rate(container_network_receive_bytes_total{namespace=\"team-payments\"}[5m])) by (pod)",
              "legendFormat": "{{pod}} rx"
            },
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "sum(rate(container_network_transmit_bytes_total{namespace=\"team-payments\"}[5m])) by (pod)",
              "legendFormat": "{{pod}} tx"
            }
          ]
        },
        {
          "id": 5,
          "title": "Pods available",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "x": 0, "y": 16, "w": 12, "h": 8 },
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "sum(kube_deployment_status_replicas_available{namespace=\"team-payments\"}) by (deployment)",
              "legendFormat": "{{deployment}}"
            }
          ]
        },
        {
          "id": 6,
          "title": "Nginx frontend requests/sec",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "x": 12, "y": 16, "w": 12, "h": 8 },
          "fieldConfig": { "defaults": { "unit": "reqps" }, "overrides": [] },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "sum(rate(nginx_http_requests_total{namespace=\"team-payments\"}[5m])) by (pod)",
              "legendFormat": "{{pod}}"
            }
          ]
        },
        {
          "id": 7,
          "title": "HPA CPU utilization vs target",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "x": 0, "y": 24, "w": 12, "h": 8 },
          "fieldConfig": { "defaults": { "unit": "percent" }, "overrides": [] },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "kube_horizontalpodautoscaler_status_target_metric{namespace=\"team-payments\", metric_target_type=\"utilization\"}",
              "legendFormat": "{{horizontalpodautoscaler}} current"
            },
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "kube_horizontalpodautoscaler_spec_target_metric{namespace=\"team-payments\", metric_target_type=\"utilization\"}",
              "legendFormat": "{{horizontalpodautoscaler}} target"
            }
          ]
        },
        {
          "id": 8,
          "title": "Request rate by mTLS status (Istio)",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "x": 0, "y": 32, "w": 12, "h": 8 },
          "fieldConfig": { "defaults": { "unit": "reqps" }, "overrides": [] },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "sum(rate(istio_requests_total{destination_service_namespace=\"team-payments\"}[5m])) by (destination_service_name, connection_security_policy)",
              "legendFormat": "{{destination_service_name}} ({{connection_security_policy}})"
            }
          ]
        },
        {
          "id": 9,
          "title": "Request rate by response code (Istio)",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "x": 12, "y": 32, "w": 12, "h": 8 },
          "fieldConfig": { "defaults": { "unit": "reqps" }, "overrides": [] },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "sum(rate(istio_requests_total{destination_service_namespace=\"team-payments\"}[5m])) by (destination_service_name, response_code)",
              "legendFormat": "{{destination_service_name}} {{response_code}}"
            }
          ]
        },
        {
          "id": 10,
          "title": "Upstream connection failures (feeds circuit breaker)",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "x": 0, "y": 40, "w": 12, "h": 8 },
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "sum(increase(envoy_cluster_upstream_cx_connect_fail{namespace=\"team-payments\"}[5m])) by (pod)",
              "legendFormat": "{{pod}}"
            }
          ]
        },
        {
          "id": 11,
          "title": "Circuit breaker open (DestinationRule outlierDetection)",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "x": 12, "y": 40, "w": 12, "h": 8 },
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "envoy_cluster_circuit_breakers_default_cx_open{namespace=\"team-payments\"}",
              "legendFormat": "{{pod}} cx_open"
            }
          ]
        }
      ]
    }
